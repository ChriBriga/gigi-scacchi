<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a2399"/>
      <stop offset="1" stop-color="#150a33"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".42" r=".6">
      <stop offset="0" stop-color="#9b7cff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#9b7cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbe2fa"/>
      <stop offset="1" stop-color="#9aa7d8"/>
    </linearGradient>
    <linearGradient id="collar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35cdb0"/>
      <stop offset=".5" stop-color="#8a6ee8"/>
      <stop offset="1" stop-color="#e05fc0"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc962"/>
      <stop offset="1" stop-color="#ef8419"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe681"/>
      <stop offset="1" stop-color="#f0a91c"/>
    </linearGradient>
    <clipPath id="clip"><rect width="512" height="512" rx="116"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#glow)"/>
    <!-- scacchiera in basso -->
    <g opacity=".22" fill="#fff">
      <rect x="0" y="416" width="64" height="48"/><rect x="128" y="416" width="64" height="48"/><rect x="256" y="416" width="64" height="48"/><rect x="384" y="416" width="64" height="48"/>
      <rect x="64" y="464" width="64" height="48"/><rect x="192" y="464" width="64" height="48"/><rect x="320" y="464" width="64" height="48"/><rect x="448" y="464" width="64" height="48"/>
    </g>
    <!-- collo cangiante -->
    <ellipse cx="256" cy="402" rx="150" ry="62" fill="url(#collar)"/>
    <ellipse cx="256" cy="462" rx="190" ry="70" fill="#8592c6"/>
    <!-- testa -->
    <circle cx="256" cy="300" r="138" fill="url(#head)"/>
    <ellipse cx="214" cy="230" rx="52" ry="26" fill="#fff" opacity=".25"/>
    <circle cx="158" cy="332" r="22" fill="#ff8fb4" opacity=".5"/>
    <circle cx="354" cy="332" r="22" fill="#ff8fb4" opacity=".5"/>
    <!-- occhi -->
    <g>
      <circle cx="204" cy="282" r="38" fill="#fff"/><circle cx="308" cy="282" r="38" fill="#fff"/>
      <circle cx="206" cy="286" r="25" fill="#ff9a1f"/><circle cx="310" cy="286" r="25" fill="#ff9a1f"/>
      <circle cx="206" cy="286" r="14" fill="#2a1230"/><circle cx="310" cy="286" r="14" fill="#2a1230"/>
      <circle cx="215" cy="275" r="8" fill="#fff"/><circle cx="319" cy="275" r="8" fill="#fff"/>
    </g>
    <path d="M168 234 Q204 214 240 234 M272 234 Q308 214 344 234" stroke="#2a1230" stroke-width="11" stroke-linecap="round" fill="none" opacity=".8"/>
    <!-- becco -->
    <ellipse cx="256" cy="326" rx="24" ry="14" fill="#f6f2ff"/>
    <path d="M222 330 Q256 306 290 330 Q282 372 256 392 Q230 372 222 330 Z" fill="url(#beak)"/>
    <!-- corona a torre -->
    <g transform="rotate(-6 256 168)">
      <path d="M182 176 L182 100 L214 100 L214 126 L240 126 L240 100 L272 100 L272 126 L298 126 L298 100 L330 100 L330 176 Z" fill="url(#gold)" stroke="#c98512" stroke-width="7" stroke-linejoin="round"/>
      <rect x="176" y="166" width="160" height="26" rx="12" fill="url(#gold)" stroke="#c98512" stroke-width="7"/>
      <circle cx="256" cy="150" r="12" fill="#ff4d6a" stroke="#fff" stroke-width="3.5"/>
      <circle cx="212" cy="152" r="7" fill="#3fe0d0"/><circle cx="300" cy="152" r="7" fill="#3fe0d0"/>
    </g>
  </g>
</svg>
